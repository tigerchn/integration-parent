server:
  port: 8081

spring:
  application:
    name: integration-admin-api
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/integration_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 无密码的本地 Redis 请勿配置 password；有密码时取消注释并填写
      # password: your-redis-password
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0

integration:
  redisson:
    # 为 true 且 spring.data.redis 可连时注册 RedissonClient（分布式锁等）；本地无 Redis 请保持 false
    enabled: false
  security:
    enabled: false
  openapi:
    title: Integration Admin API
    version: 1.0.0
  admin:
    security:
      redis-token-blacklist-enabled: true
      jwt:
        secret: "integration-admin-jwt-secret-change-me-32b!"
        expires-in-seconds: 28800

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} [%X{traceId:-}] %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
