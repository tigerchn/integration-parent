spring:
  datasource:
    url: jdbc:h2:mem:integration_client;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/client-schema.sql
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - com.integration.common.redis.autoconfigure.IntegrationRedisAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration

integration:
  redisson:
    enabled: false
  client:
    wechat:
      mini-program:
        mock-enabled: true
    security:
      redis-token-blacklist-enabled: false
      jwt:
        secret: "integration-client-jwt-secret-change-me-32b!!"
        expires-in-seconds: 604800
