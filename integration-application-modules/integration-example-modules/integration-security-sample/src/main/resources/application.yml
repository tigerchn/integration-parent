server:
  port: 8081

spring:
  application:
    name: integration-security-sample

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Enables IntegrationSecurityAutoConfiguration (SecurityFilterChain from starter).
# JWT issuer omitted: protected routes require an authenticated principal (caller gets 401 without credentials).
integration:
  security:
    enabled: true
    permit-all-patterns:
      - /actuator/health
      - /actuator/info
      - /api/public/**

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} [%X{traceId:-}] %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
