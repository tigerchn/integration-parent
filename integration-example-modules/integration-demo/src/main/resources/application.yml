server:
  port: 8080

spring:
  application:
    name: integration-demo
  data:
    redis:
      # 本地 Redis，无密码：不配置 password；有密码时再取消注释并填写
      host: 127.0.0.1
      port: 6379
  autoconfigure:
    exclude:
      # Brave/Micrometer tracing stays on classpath; disable Zipkin HTTP export when no collector (default localhost:9411).
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0

integration:
  redisson:
    # 为 true 且 Redis 可连时注册 RedissonClient；本地无 Redis 请保持 false
    enabled: false
  openapi:
    title: Integration Demo API
    version: 1.0.0
  demo:
    job-heartbeat-ms: 600000

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} [%X{traceId:-}] %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
