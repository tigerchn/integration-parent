server:
  port: 8088

spring:
  application:
    name: integration-cache-demo
  cache:
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m

management:
  endpoints:
    web:
      exposure:
        include: health,info

integration:
  openapi:
    title: Integration Cache Demo API
    version: 1.0.0
  cache:
    # false：应用可正常启动，/api/cache-demo 等演示接口不注册；true：启用 Caffeine + 演示 API
    enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} [%X{traceId:-}] %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
