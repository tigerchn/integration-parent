server:
  port: 8087

spring:
  application:
    name: integration-encrypt-demo

management:
  endpoints:
    web:
      exposure:
        include: health,info

integration:
  openapi:
    enabled: true
    title: Integration Encrypt Demo API
    version: 1.0.0
  # 演示用 RSA 2048 密钥对（勿用于生产）；算法与 starter 默认 OAEP 一致
  # 全局请求解密 / 全局响应加密；exclude-paths 对请求解密与响应加密同时生效
  encrypt:
    enable: true
    decrypt-request-body-enabled: false
    encrypt-response-body-enabled: false
    exclude-paths:
      - "/actuator"
      - "/api/encrypt-demo/ping"
      - "/doc.html"
      - "/swagger-ui"
      - "/swagger-ui/**"
      - "/swagger-ui.html"
      - "/v3/api-docs"
      - "/v3/api-docs/**"
      - "/webjars/**"
    #rsa-public-key: ""
    #rsa-private-key: ""
    rsa-public-key: ""
    rsa-private-key: ""
